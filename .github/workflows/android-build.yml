name: Android APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode in android/build.gradle.kts is `git rev-list --count
          # HEAD` — with the default shallow clone (depth 1) that always
          # comes out as 1, so every CI build "versioned" identically. Full
          # history is needed for the count (and the tag below) to mean
          # anything.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run common tests
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:MaxDirectMemorySize=512m"
        run: ./gradlew :common:desktopTest --no-daemon

      - name: Decode release keystore
        run: echo "${{ secrets.ACP_SSH_KMP_RELEASE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:MaxDirectMemorySize=512m"
          ACP_SSH_KMP_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          ACP_SSH_KMP_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ACP_SSH_KMP_RELEASE_KEYSTORE_PASSWORD }}
          ACP_SSH_KMP_RELEASE_KEY_ALIAS: ${{ secrets.ACP_SSH_KMP_RELEASE_KEY_ALIAS }}
          ACP_SSH_KMP_RELEASE_KEY_PASSWORD: ${{ secrets.ACP_SSH_KMP_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease --no-daemon

      - name: Compute build version
        id: version
        run: |
          # Same versionCode the Gradle build just embedded in the APK
          # (android/build.gradle.kts:gitCommitCount()) — kept in sync so the
          # tag/filename always match what's actually inside the package.
          version_code=$(git rev-list --count HEAD)
          version_name=$(grep -oP 'versionName = "\K[^"]+' android/build.gradle.kts)
          short_sha=$(git rev-parse --short HEAD)
          tag="v${version_name}-${version_code}"
          apk_name="acp-ssh-kmp-${tag}-${short_sha}.apk"
          echo "tag=${tag}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mv android/build/outputs/apk/release/android-release.apk \
             "android/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: android/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
          if-no-files-found: error

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.apk_name }}
          body: "Automated signed release APK build from ${{ github.sha }}."
          prerelease: true
          files: android/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
