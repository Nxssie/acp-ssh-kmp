[versions]
# Las versiones de plugins (kotlin/agp/compose) viven en gradle.properties
# (leídas por pluginManagement); mantener en sync.
compose = "1.11.1"
coroutines = "1.11.0"
serialization = "1.11.0"
kotlinxIo = "0.9.1"
sshj = "0.40.0"
bouncycastle = "1.80.2"
activityCompose = "1.13.0"
androidxCore = "1.18.0"
lifecycleProcess = "2.9.4"
securityCrypto = "1.1.0-alpha06"
coroutinesAndroid = "1.11.0"
# Material3 tiene tren de versiones propio (desacoplado de CMP): no existe
# estable 1.11.x; 1.9.0 es la última estable y es compatible con CMP 1.11.
composeMaterial3 = "1.9.0"
# Icons (core+extended) también van desacopladas: el set de íconos apenas
# cambia, así que no siguen el ritmo de releases del runtime de CMP — 1.7.3
# es la última publicada de ambas (verificado en Maven Central: bajé los
# jars y confirmé con unzip -l qué clase vive en cuál — Close/MoreVert/Send
# viven en core, Stop/Logout/KeyboardReturn en extended; desde CMP 1.8.2
# "extended" ya no trae "core" transitivo, así que hacen falta las dos).
composeMaterialIcons = "1.7.3"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "composeMaterialIcons" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMaterialIcons" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }

sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycleProcess" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutinesAndroid" }
